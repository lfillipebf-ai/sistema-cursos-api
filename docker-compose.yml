services:
  postgres:
    image: postgres:16
    container_name: cursos-postgres
    environment:
      POSTGRES_DB: cursos
      POSTGRES_USER: cursos
      POSTGRES_PASSWORD: cursos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursos -d cursos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    container_name: cursos-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cursos
      SPRING_DATASOURCE_USERNAME: cursos
      SPRING_DATASOURCE_PASSWORD: cursos
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
